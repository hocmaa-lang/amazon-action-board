<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Amazon Action Board</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{--bg:#f3f5f4;--panel:#fff;--ink:#1a2220;--muted:#5b6964;--line:#dce2df;--accent:#2c6a55;--stop:#b3402c;
 --sans:"Source Sans 3","Segoe UI",Arial,sans-serif}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#111614;--panel:#19201d;--ink:#e5ebe8;--muted:#9aa8a2;--line:#2b3531;--accent:#6cc19c;--stop:#ea8671}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:var(--sans);padding:24px 16px}
.gate{width:100%;max-width:360px}
h1{font:700 26px/1.2 "Rubik","Segoe UI",Arial,sans-serif;margin:0 0 6px}
p.sub{color:var(--muted);font-size:15px;margin:0 0 24px}
label{display:block;font-size:13.5px;font-weight:600;color:var(--muted);margin:0 0 6px}
input{width:100%;padding:11px 13px;font:16px var(--sans);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;margin-bottom:16px}
input:focus,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
button{width:100%;padding:12px;font:700 16px var(--sans);cursor:pointer;background:var(--accent);color:var(--panel);border:0;border-radius:6px}
button:disabled{opacity:.6;cursor:progress}
.err{color:var(--stop);font-size:14.5px;min-height:22px;margin-top:12px}
</style></head><body>
<div class="gate" id="gate">
  <h1>Amazon Action Board</h1>
  <p class="sub">Sign in with the username and password you were given. Type in English.</p>
  <form id="f">

    <label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required>
    <button id="b" type="submit">Sign in</button>
  </form>
  <div class="err" id="e" role="status" aria-live="polite"></div>
</div>

const ITER=310000;
const b2a=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
const enc=new TextEncoder(),dec=new TextDecoder();
async function hex(s){return [...new Uint8Array(await crypto.subtle.digest('SHA-256',enc.encode(s)))].map(x=>x.toString(16).padStart(2,'0')).join('');}
async function open(bundle){
  const k=await crypto.subtle.importKey('raw',b2a(bundle.dataKey),'AES-GCM',false,['decrypt']);
  const html=dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b2a(APP.iv)},k,b2a(APP.ct)));
  const boot='<script>window.__BOARD='+JSON.stringify(bundle).replace(/</g,'\\u003c')+'<\/script>';
  const doc='<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">'+boot+'</head><body>'+html+'</body></html>';
  document.body.innerHTML='';
  document.body.style.cssText='margin:0;padding:0;display:block;overflow:hidden';
  const f=document.createElement('iframe');
  f.title=document.title;
  f.style.cssText='position:fixed;inset:0;width:100%;height:100%;border:0';
  f.srcdoc=doc;
  document.body.appendChild(f);
}
try{const s=sessionStorage.getItem('aab_session');if(s)open(JSON.parse(s)).catch(()=>sessionStorage.removeItem('aab_session'));}catch(_){}

  btn.disabled=true;err.textContent='Signing in…';
  try{
    const u=document.getElementById('u').value.trim().toLowerCase(),p=document.getElementById('p').value.trim().toLowerCase();
    if(/[֐-׿]/.test(u+p)){err.textContent='Switch your keyboard to English and type again.';btn.disabled=false;return;}
    const e=USERS[await hex('aab:'+u)];
    if(!e)throw 0;
    const base=await crypto.subtle.importKey('raw',enc.encode(u+':'+p),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b2a(e.salt),iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    const bundle=JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b2a(e.iv)},key,b2a(e.ct))));
    try{sessionStorage.setItem('aab_session',JSON.stringify(bundle));}catch(_){}
    await open(bundle);
  }catch(_){
    err.textContent='Wrong username or password.';
    btn.disabled=false;
  }
});
</script></body></html>
