<style>
:root{--bg:#f3f5f4;--panel:#fff;--ink:#1a2220;--muted:#5b6964;--line:#dce2df;--accent:#1f4fa3;--stop:#b3402c;

const ITER=310000;
const b2a=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
const enc=new TextEncoder(),dec=new TextDecoder();
async function hex(s){return [...new Uint8Array(await crypto.subtle.digest('SHA-256',enc.encode(s)))].map(x=>x.toString(16).padStart(2,'0')).join('');}
async function open(bundle){
  const k=await crypto.subtle.importKey('raw',b2a(bundle.dataKey),'AES-GCM',false,['decrypt']);
  const html=dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b2a(APP.iv)},k,b2a(APP.ct)));
  const boot='<script>window.__BOARD='+JSON.stringify(bundle).replace(/</g,'\\u003c')+'<\/script>';
  const doc='<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">'+boot+'</head><body>'+html+'</body></html>';
  document.body.innerHTML='';
  document.body.style.cssText='margin:0;padding:0;display:block;overflow:hidden';
  const f=document.createElement('iframe');
  f.title=document.title;
  f.style.cssText='position:fixed;inset:0;width:100%;height:100%;border:0';
  f.srcdoc=doc;
  document.body.appendChild(f);
}
async function unlock(u,p){const e=USERS[await hex('gade:'+u)];if(!e)throw 0;const base=await crypto.subtle.importKey('raw',enc.encode(u+':'+p),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b2a(e.salt),iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);return JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b2a(e.iv)},key,b2a(e.ct))));}
const LK=(location.hash.match(/k=([A-Za-z0-9_-]+)/)||[])[1];
if(LK){document.getElementById('gate').innerHTML='<p class="sub">טוען…</p>';unlock('link',LK.toLowerCase()).then(open).catch(()=>{document.getElementById('gate').innerHTML='<h1>הקישור לא תקין</h1><p class="sub">בקשו מדביר את הקישור המלא.</p>'});}
else try{const s=sessionStorage.getItem('gade_stories_session');if(s)open(JSON.parse(s)).catch(()=>sessionStorage.removeItem('gade_stories_session'));}catch(_){}
document.getElementById('f').addEventListener('submit',async ev=>{
  ev.preventDefault();
  const btn=document.getElementById('b'),err=document.getElementById('e');
  btn.disabled=true;err.textContent='נכנס…';
  try{
    const u=document.getElementById('u').value.trim().toLowerCase(),p=document.getElementById('p').value.trim().toLowerCase();
    if(/[֐-׿]/.test(u+p)){err.textContent='העבירו את המקלדת לאנגלית והקלידו שוב.';btn.disabled=false;return;}
    const e=USERS[await hex('gade:'+u)];
    if(!e)throw 0;
    const base=await crypto.subtle.importKey('raw',enc.encode(u+':'+p),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b2a(e.salt),iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    const bundle=JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b2a(e.iv)},key,b2a(e.ct))));
    try{sessionStorage.setItem('gade_stories_session',JSON.stringify(bundle));}catch(_){}
    await open(bundle);
  }catch(_){
    err.textContent='שם משתמש או סיסמה שגויים.';
    btn.disabled=false;
  }
});
</script></body></html>
